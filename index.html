<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP NEON - Gaming Apps Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050811;
      --card-bg: #0b1120;
      --neon-blue: #00f3ff;
      --neon-glow: rgba(0, 243, 255, 0.4);
      --text-color: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.05) 0%, transparent 40%);
    }

    header {
      text-align: center;
      padding: 40px 20px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    h1.brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
    }

    header p {
      color: var(--neon-blue);
      marginTop: 8px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .app-card:hover {
      transform: translateY(-5px);
      border-color: var(--neon-blue);
      box-shadow: 0 0 15px var(--neon-glow);
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .app-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 10px;
    }

    .app-desc {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 20px;
      flex-grow: 1;
      white-space: pre-line;
    }

    .btn-download {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 12px 0;
      background: transparent;
      color: var(--neon-blue);
      border: 1px solid var(--neon-blue);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      border-radius: 6px;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 5px var(--neon-glow);
      cursor: pointer;
    }

    .btn-download:hover {
      background: var(--neon-blue);
      color: #000;
      box-shadow: 0 0 15px var(--neon-blue);
    }

    .loader {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-blue);
      font-size: 1.2rem;
      padding: 50px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title">VIP NEON</h1>
    <p>Exclusive Gaming Apps Hub</p>
  </header>

  <div class="container">
    <div id="loader" class="loader">Loading Apps from Telegram...</div>
    <div class="app-grid" id="appGrid"></div>
  </div>

  <script>
    // আপনার টেলিগ্রাম বটের টোকেন এবং চ্যানেলের ইউজারনেম এখানে সরাসরি বসিয়ে দিন
    const BOT_TOKEN = "8886160753:AAF7KohpCxo80WiMIp94uNUg4y6v8wad7iY"; //[span_0](start_span)[span_0](end_span)
    const CHANNEL_USERNAME = "nmdnahid2020"; // আপনার চ্যানেল ইউজারনেম
    
    // আপনার নিজের টেলিগ্রাম চ্যাট আইডি (যেখানে নোটিফিকেশন যাবে)
    // আপনি চাইলে এখানে আপনার ইউজার আইডি বা নোটিফিকেশন পাওয়ার চ্যাট আইডি দিতে পারেন
    // অথবা বট যে আইডিতে মেসেজ পাঠাবে সেটির জন্য বটের ইনবক্স ব্যবহার করতে পারেন।
    // বটের চ্যাট আইডি পেতে চাইলে বটের ইনবক্সে মেসেজ দিয়ে getUpdates চেক করতে পারেন।
    const ADMIN_CHAT_ID = "YOUR_TELEGRAM_CHAT_ID"; 

    // ১. টেলিগ্রাম চ্যানেল থেকে অটোমেটিক পোস্ট নিয়ে আসা
    async function loadTelegramApps() {
      const appGrid = document.getElementById('appGrid');
      const loader = document.getElementById('loader');

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
        const data = await response.json();

        loader.style.display = 'none';

        if (!data.ok || !data.result) {
          appGrid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">অ্যাপস লোড করতে সমস্যা হয়েছে।</p>';
          return;
        }

        // চ্যানেলের পোস্টগুলো ফিল্টার করা
        const channelPosts = data.result.filter(
          item => item.channel_post && item.channel_post.chat && item.channel_post.chat.username === CHANNEL_USERNAME
        );

        if (channelPosts.length === 0) {
          appGrid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">চ্যানেলে কোনো পোস্ট পাওয়া যায়নি।</p>';
          return;
        }

        appGrid.innerHTML = ""; // আগের লোডার মুছে ফেলা

        channelPosts.forEach(item => {
          const msg = item.channel_post;
          const caption = msg.caption || msg.text || "কোনো বিবরণ নেই";
          
          // প্রথম লাইন টাইটেল এবং বাকি অংশ ডেসক্রিপশন হিসেবে ভাগ করা
          const lines = caption.split('\n');
          const title = lines[0] ? lines[0].replace(/[*_#]/g, '') : "VIP App";
          const description = lines.slice(1).join('\n').trim() || caption;
          const downloadUrl = `https://t.me/${CHANNEL_USERNAME}/${msg.message_id}`;

          const card = document.createElement('div');
          card.className = 'app-card';

          card.innerHTML = `
            <div class="card-body">
              <h3 class="app-title">${title}</h3>
              <p class="app-desc">${description}</p>
              <a href="${downloadUrl}" target="_blank" class="btn-download" onclick="sendDownloadNotification('${title.replace(/'/g, "\\'")}')">Download App</a>
            </div>
          `;

          appGrid.appendChild(card);
        });

      } catch (error) {
        console.error('Error:', error);
        loader.innerText = 'সার্ভার কানেকশনে সমস্যা হয়েছে।';
      }
    }

    // ২. কেউ ডাউনলোড বাটনে ক্লিক করলে টেলিগ্রামে নোটিফিকেশন পাঠানোর ফাংশন
    function sendDownloadNotification(appName) {
      if (ADMIN_CHAT_ID === "YOUR_TELEGRAM_CHAT_ID") return; // আইডি সেট করা না থাকলে স্কিপ করবে
      
      const message = `🚨 নোটিফিকেশন: কেউ একজন আপনার ওয়েবসাইট থেকে "${appName}" অ্যাপটি ডাউনলোড করার জন্য লিংকে ক্লিক করেছে!`;
      const notifyUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_CHAT_ID}&text=${encodeURIComponent(message)}`;
      
      // ব্যাকগ্রাউন্ডে নোটিফিকেশন পাঠিয়ে দেওয়া
      fetch(notifyUrl).catch(err => console.log('Notification error:', err));
    }

    // পেজ লোড হলেই অ্যাপস ফেচ করা শুরু করবে
    loadTelegramApps();
  </script>
</body>
</html>
