<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP NEON - Gaming Apps Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050811;
      --card-bg: #0b1120;
      --neon-blue: #00f3ff;
      --neon-glow: rgba(0, 243, 255, 0.4);
      --text-color: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.05) 0%, transparent 40%);
    }

    header {
      text-align: center;
      padding: 40px 20px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    h1.brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
    }

    header p {
      color: var(--neon-blue);
      margin-top: 8px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .app-card:hover {
      transform: translateY(-5px);
      border-color: var(--neon-blue);
      box-shadow: 0 0 15px var(--neon-glow);
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .app-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 10px;
    }

    .app-desc {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 20px;
      flex-grow: 1;
      white-space: pre-line;
    }

    .btn-download {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 12px 0;
      background: transparent;
      color: var(--neon-blue);
      border: 1px solid var(--neon-blue);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      border-radius: 6px;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 5px var(--neon-glow);
      cursor: pointer;
    }

    .btn-download:hover {
      background: var(--neon-blue);
      color: #000;
      box-shadow: 0 0 15px var(--neon-blue);
    }

    .loader {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-blue);
      font-size: 1.2rem;
      padding: 50px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title">VIP NEON</h1>
    <p>Exclusive Gaming Apps Hub</p>
  </header>

  <div class="container">
    <div id="loader" class="loader">Loading Live Apps from Telegram...</div>
    <div class="app-grid" id="appGrid"></div>
  </div>

  <script>
    // আপনার টেলিগ্রাম চ্যানেলের ইউজারনেম
    const CHANNEL = "nmdnahid2020";
    
    // টেলিগ্রাম পাবলিক চ্যানেলের RSS ফিড থেকে ডেটা ফেচ করার জন্য ফ্রি API ব্যবহার করা হচ্ছে
    // এতে GitHub Pages-এ কোনো ব্যাকএন্ড ছাড়াই সরাসরি অটোমেটিক পোস্ট শো করবে
    async function fetchTelegramPosts() {
      const appGrid = document.getElementById('appGrid');
      const loader = document.getElementById('loader');

      try {
        // Telegram Web RSS endpoint
        const rssUrl = `https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ft.me%2Fs%2F${CHANNEL}`;
        const response = await fetch(rssUrl);
        const data = await response.json();

        loader.style.display = 'none';

        if (data.status === 'ok' && data.items && data.items.length > 0) {
          appGrid.innerHTML = "";

          data.items.forEach(item => {
            // টেলিগ্রাম পোস্টের টাইটেল বা প্রথম অংশ অ্যাপের নাম হিসেবে ধরা
            const cleanContent = item.description.replace(/<[^>]*>/g, ''); // HTML ট্যাগ রিমোভ করা
            const lines = cleanContent.split('\n');
            const title = lines[0] ? lines[0].substring(0, 40) : "VIP Gaming App";
            const description = cleanContent.length > 150 ? cleanContent.substring(0, 150) + "..." : cleanContent;
            const postLink = item.link;

            const card = document.createElement('div');
            card.className = 'app-card';

            card.innerHTML = `
              <div class="card-body">
                <h3 class="app-title">${title}</h3>
                <p class="app-desc">${description}</p>
                <a href="${postLink}" target="_blank" class="btn-download">Download / View</a>
              </div>
            `;

            appGrid.appendChild(card);
          });
        } else {
          appGrid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">চ্যানেলে কোনো পোস্ট পাওয়া যায়নি।</p>';
        }

      } catch (error) {
        console.error('Error fetching telegram feed:', error);
        loader.innerText = 'ডেটা লোড করতে সমস্যা হয়েছে। দয়া করে কিছুক্ষণ পর আবার চেষ্টা করুন।';
      }
    }

    fetchTelegramPosts();
  </script>
</body>
</html>
