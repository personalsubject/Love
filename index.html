<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Nahid - Gaming Apps Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050811;
      --card-bg: #0b1120;
      --neon-blue: #00f3ff;
      --neon-glow: rgba(0, 243, 255, 0.4);
      --text-color: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.05) 0%, transparent 40%);
    }

    header {
      text-align: center;
      padding: 30px 20px 20px 20px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    h1.brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
    }

    header p {
      color: var(--neon-blue);
      margin-top: 5px;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    /* Direct Telegram Widget Container */
    .telegram-feed-box {
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 12px;
      padding: 20px 10px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
      text-align: center;
    }

    /* Customizing embedded iframe area */
    .telegram-feed-box iframe {
      width: 100% !important;
      border: none !important;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title">Creative Nahid</h1>
    <p>Exclusive Gaming Apps Hub</p>
  </header>

  <div class="container">
    <div class="telegram-feed-box">
      <!-- Direct Official Telegram Feed Script -->
      <script async src="https://telegram.org/js/telegram-widget.js?22" 
              data-telegram-post-discussion="nmdnahid2020" 
              data-comments-limit="10"
              data-telegram-channel="nmdnahid2020" 
              data-width="100%" 
              data-height="700" 
              data-color="00F3FF" 
              data-dark="1">
      </script>
    </div>
  </div>

  <script>
    const BOT_TOKEN = "8886160753:AAF7KohpCxo80WiMIp94uNUg4y6v8wad7iY";
    const YOUR_USER_ID = "8818940901";

    // কেউ ক্লিক করলে বটে মেসেজ পাঠানোর জন্য ইভেন্ট ট্র্যাকার
    document.addEventListener('click', function (e) {
      if (e.target.tagName === 'A' || e.target.closest('a')) {
        const msg = `🚀 *Creative Nahid Alert!*\n\nকেউ একজন ওয়েবসাইট থেকে অ্যাপস বা লিংকে ক্লিক করেছে!`;
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${YOUR_USER_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
        fetch(url).catch(err => console.log(err));
      }
    });
  </script>

</body>
</html>
